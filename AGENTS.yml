version: 1

workspace:
  read: true
  write: true

  denied_files:
    - AGENTS.yml

imports:
  go:
    path: "//stdlib/golang.star"
    tools:
      build_check: true
      format_check: true

environment:
  hello: |
    def hello(world):
      return "Hello, " + world
  whoami: |
    def whoami():
      """
      Return the current user.
      """
      return privileged.shell("whoami").output()