version: 1
provider:
  name: test
  scripts:
    - service: ""
      script: print("Hello, World")

    - service: hello
      script: test = "World"
    - service: hello
      script: print(hello(test))
services:
  hello:
    kind: shell-repl
    args: ["go", "run", "./cmd/sa-service", "-cwd", "."]
