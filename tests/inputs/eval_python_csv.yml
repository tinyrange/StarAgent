# Evaluation focus: structured data parsing and CLI behavior
# Run only after review; live recordings are retained in tests/sessions.
version: 1
provider:
  name: "openai"
  model: "gpt-6.1-sol"
  reasoning: "high"
developer: "Keep changes small and preserve public APIs unless the task asks for a change. Use the available checks and report their results. If a required toolchain is missing, report that rather than installing it."
services:
  main:
    kind: "service"
    temp_workspace: true
    files:
      AGENTS.yml: |
        version: 1
        workspace:
          read: true
          write: true
          denied_files: ["AGENTS.yml", "check.py"]
        environment:
          check: |
            def check():
                "check() -> result: Check CSV quoting, filtering, and JSON CLI output."
                return privileged.shell("python3", "-B", "check.py", timeout=30).run()
      README.md: |
        # Contact export
        Python 3, no dependencies. Input has the CSV header name,email,active.
        Quoted fields may contain commas, doubled quotes, or newlines.
        Output entries contain name and email only. Run `python3 -B check.py`.
      contacts.py: |
        import json
        import sys

        def convert(text):
            result = []
            for line in text.strip().splitlines()[1:]:
                name, email, active = line.split(",")
                if active:
                    result.append({"name": name.strip(), "email": email})
            return result

        if __name__ == "__main__":
            print(json.dumps(convert(sys.stdin.read())))
      check.py: |
        import json
        import subprocess
        import sys

        def export(text):
            result = subprocess.run([sys.executable, "-B", "contacts.py"], input=text,
                                    text=True, capture_output=True)
            assert result.returncode == 0, result.stderr
            assert result.stderr == "", result.stderr
            return json.loads(result.stdout)

        data = ('name,email,active\r\n'
                '"Doe, Ada", ada@example.test , TRUE \r\n'
                'Skip,skip@example.test,false\r\n'
                '"Line one\nLine two",lines@example.test,true\r\n'
                '"  Jo ""JJ""  ",jo@example.test,true\r\n')
        expected = [
            {"name": "Doe, Ada", "email": "ada@example.test"},
            {"name": "Line one\nLine two", "email": "lines@example.test"},
            {"name": '  Jo "JJ"  ', "email": "jo@example.test"},
        ]
        assert export(data) == expected
        assert export("name,email,active\n") == []
        print("CSV export checks passed")
prompt: |
  Our contact export breaks on names containing commas or line breaks, and inactive
  contacts are appearing in the output. Repair contacts.py. It must read CSV from stdin
  and write one JSON array to stdout, keeping active contacts in input order. An active
  value of true is case-insensitive and may have surrounding whitespace; false rows
  are omitted. Preserve names exactly, trim email whitespace, and handle header-only
  input. Keep the existing CLI and do not add dependencies.
