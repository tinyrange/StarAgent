  bank:
    kind: "service"
    temp_workspace: true
    files:
      AGENTS.yml: |
        version: 1
        environment:
          currencies: |
            def currencies():
                "currencies() -> dict: Currency decimal exponents for this settlement export."
                return json.decode(privileged.shell("python3","-B","api.py","currencies", timeout=15).output())
          totals: |
            def totals(day):
