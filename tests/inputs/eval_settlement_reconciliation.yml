# Evaluation revision 2. Paid recordings are retained in tests/sessions.
version: 1
provider:
  name: "openai"
  model: "gpt-6.1-sol"
  reasoning: "high"
  max_cost_usd: 1.0
developer: "Preserve the documented interfaces. Work within the supplied workspaces and service APIs. Use installed toolchains and standard libraries. Report what you changed, the evidence you obtained, and any remaining limitations."
services:
  ledger:
    kind: "service"
    temp_workspace: true
    files:
      AGENTS.yml: |
        version: 1
        workspace:
          read: true
          write: true
          denied_files: ["AGENTS.yml", "SPEC.txt", "check.py"]
        environment:
          check: |
            def check():
                "check() -> result: Run local revision, money and calendar examples."
                return privileged.shell("python3", "-B", "check.py", timeout=15).run()
          python: |
            def python(path, *args):
                "python(path, *args) -> result: Run a workspace Python diagnostic entrypoint."
                return privileged.shell("python3", "-B", path, timeout=60, *args).run()
      SPEC.txt: |
        Repair summarize(events, bindings, currencies) in ledger.py. Return
        {account: {currency: {settled_minor, refunded_minor, net_minor, payments}}}.
        The three monetary fields are canonical integer decimal strings. currencies maps
        currency to decimal exponent. Never round through float; reject fractional minor
        units. payments counts distinct posted settled operations. Include refund-only
        accounts. Inputs must not be mutated. The CLI reads an object containing events,
        bindings, currencies and emits the summary; retain this interface.

        Reconcile Brisbane business day 2026-10-01 (UTC+10). effective_at has an ISO offset.
        Operation identity is (provider,route,epoch,reference). Select its highest revision
        across the ENTIRE feed first; a highest revision with status void removes it.
        Filter by business day only after revision selection. Transport delivery IDs are
        not operation identity. Equal highest revisions must agree on business fields;
        conflicting values are data errors. Amounts are decimal major units; refunds are
        positive amounts in their own operation identity. Routing bindings map
        (provider,route,epoch) to account. Later routing epochs do not revise earlier ones.
        Unresolved or conflicting bindings must never silently merge into a guessed account.

        The routing service returns retained epoch bindings; the bank exports final totals
        by provider and independently by batch, split by currency. Those exports count
        business operations, not deliveries. Preserve both dimensions when reconciling:
        adding overlapping exports double-counts money. The final per-account result must
        be justified by both the operation feed and authoritative routing, not just by a
        matching grand total. Save production-day output as reconciled.json when supported.
      ledger.py: |
        import json,sys

        def summarize(events,bindings,currencies):
         routes={(b['provider'],b['route']):b['account'] for b in bindings}
         result={};seen=set()
         for e in events:
          if not e['effective_at'].startswith('2026-10-01') or e['reference'] in seen:continue
          seen.add(e['reference']);account=routes.get((e['provider'],e['route']),'unknown')
          row=result.setdefault(account,{}).setdefault(e['currency'],dict(settled_minor='0',refunded_minor='0',net_minor='0',payments=0))
          value=int(float(e['amount'])*10**currencies[e['currency']]);field='settled_minor' if e['kind']=='settled' else 'refunded_minor'
          row[field]=str(int(row[field])+value);row['net_minor']=str(int(row['settled_minor'])-int(row['refunded_minor']));row['payments']+=e['kind']=='settled'
         return result
        if __name__=='__main__':print(json.dumps(summarize(**json.load(sys.stdin)),sort_keys=True))
      check.py: |
        from ledger import summarize
        b=dict(provider='p',route='r',epoch=1,account='a');base=dict(provider='p',route='r',epoch=1,reference='same',delivery_id='d',currency='USD',amount='90071992547409.93',kind='settled',revision=1,effective_at='2026-09-30T20:30:00Z',status='posted',batch='b')
        expect={'a':{'USD':dict(settled_minor='9007199254740993',refunded_minor='0',net_minor='9007199254740993',payments=1)}}
        assert summarize([base,dict(base,delivery_id='retry')],[b],{'USD':2})==expect
        assert summarize([base,dict(base,revision=2,status='void')],[b],{'USD':2})=={}
        assert summarize([base,dict(base,revision=2,effective_at='2026-10-02T01:00:00+10:00')],[b],{'USD':2})=={}
        print('local ledger examples passed')
  deliveries:
    kind: "service"
    temp_workspace: true
    files:
      AGENTS.yml: |
        version: 1
        environment:
