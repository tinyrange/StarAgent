      api.py: |
        import json,sys
        r=json.loads(sys.argv[1]);rows=json.load(open('events.json'));cursor=r['cursor'];limit=r['limit']
        if type(cursor) is not int or type(limit) is not int or cursor<0 or not 1<=limit<=75:print(json.dumps({'error':'invalid range'}))
        else:
         end=min(len(rows),cursor+limit);print(json.dumps({'items':rows[cursor:end],'next_cursor':end if end<len(rows) else None}))
