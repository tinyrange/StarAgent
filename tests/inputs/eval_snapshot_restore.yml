          restore: |
            def restore():
                "restore() -> result: Recover manifest.json using objects.json and write verified output."
                return privileged.shell("go", "run", ".", timeout=30, env={"GOPROXY":"off","GOSUMDB":"off"}).run()
      SPEC.txt: |
        Recover(manifest Manifest, objects map[string]string) -> (map[string][]byte,error).
        Implement recovery.go. Go 1.26 standard library only. Preserve types.go and CLI.
        objects maps manifest object keys to base64 COMPLETE packed object bytes. The
        caller chooses replicas and assembles range responses. Each row selects a range,
        zlib-decompresses it to stripe.width bytes, then authenticates its SHA256.
        Missing or bad rows are erasures: continue with other independent valid rows.
        Each byte column is a linear equation over GF(256), polynomial 0x11d, XOR addition:
        row_byte = sum(coefficients[i] * data_chunk[i][column]). Coefficients are field
        bytes, not real/integer arithmetic. Solve using any independent rows; row count
        alone is not a reconstruction criterion. Validate every reconstructed chunk digest.
        Files concatenate named stripe chunks in listed order; validate file bytes and
        SHA256. Never use checksum guesses, rewrite manifests, or publish unverified data.
        Return all independently verified complete files even if others cannot be recovered;
        return a non-nil diagnostic error when any requested file is unresolved. A bad row
        must not invalidate independent stripes. Reject invalid ranges and malformed dimensions.

        The driver reads manifest.json and objects.json from the workspace, calls Recover,
        writes verified files under restored/, and prints a JSON report. check() only tests
        the local decoding layer. Catalog and object data must come from exported APIs.
      go.mod: |
        module example.test/recovery

        go 1.26.1
      types.go: |
        package main
        type Row struct{Object string `json:"object"`;Offset int `json:"offset"`;Length int `json:"length"`;Codec string `json:"codec"`;Coefficients []byte `json:"coefficients"`;SHA256 string `json:"sha256"`}
        type Stripe struct{ID string `json:"id"`;Width int `json:"width"`;DataShards int `json:"data_shards"`;Rows []Row `json:"rows"`;ChunkSHA256 []string `json:"chunk_sha256"`}
        type Chunk struct{Stripe string `json:"stripe"`;Index int `json:"index"`}
        type File struct{Name string `json:"name"`;Chunks []Chunk `json:"chunks"`;Bytes int `json:"bytes"`;SHA256 string `json:"sha256"`}
        type Manifest struct{Snapshot string `json:"snapshot"`;Stripes []Stripe `json:"stripes"`;Files []File `json:"files"`}
      recovery.go: |
        package main
        import("encoding/base64";"fmt")
        func Recover(m Manifest,objects map[string]string)(map[string][]byte,error){
         chunks:=map[string][][]byte{}
         for _,s:=range m.Stripes{for _,r:=range s.Rows{b,e:=base64.StdEncoding.DecodeString(objects[r.Object]);if e!=nil{return nil,e};chunks[s.ID]=append(chunks[s.ID],b)}}
         out:=map[string][]byte{}
         for _,f:=range m.Files{for _,c:=range f.Chunks{if c.Index>=len(chunks[c.Stripe]){return out,fmt.Errorf("incomplete")};out[f.Name]=append(out[f.Name],chunks[c.Stripe][c.Index]...)}}
         return out,nil
        }
      main.go: |
        package main
        import("crypto/sha256";"encoding/hex";"encoding/json";"fmt";"os";"path/filepath";"sort")
        func main(){
         var m Manifest;var objects map[string]string
         b,e:=os.ReadFile("manifest.json");if e!=nil{panic(e)};if e=json.Unmarshal(b,&m);e!=nil{panic(e)}
         b,e=os.ReadFile("objects.json");if e!=nil{panic(e)};if e=json.Unmarshal(b,&objects);e!=nil{panic(e)}
         out,err:=Recover(m,objects);names:=[]string{};allowed:=map[string]File{};for _,f:=range m.Files{allowed[f.Name]=f}
         for name,b:=range out{f,ok:=allowed[name];h:=sha256.Sum256(b);if !ok||!filepath.IsLocal(name)||len(b)!=f.Bytes||hex.EncodeToString(h[:])!=f.SHA256{panic("unverified output "+name)};p:=filepath.Join("restored",name);if e=os.MkdirAll(filepath.Dir(p),0755);e!=nil{panic(e)};if e=os.WriteFile(p,b,0644);e!=nil{panic(e)};names=append(names,name)}
         sort.Strings(names);report:=map[string]any{"restored":names};if err!=nil{report["error"]=err.Error()};b,_=json.Marshal(report);fmt.Println(string(b))
        }
      recovery_test.go: |
        package main
        import("bytes";"compress/zlib";"crypto/sha256";"encoding/base64";"encoding/hex";"testing")
        func digest(b []byte)string{h:=sha256.Sum256(b);return hex.EncodeToString(h[:])}
        func TestDecode(t *testing.T){
         a:=[]byte{1,2,3,4};b:=[]byte{5,6,7,8};sum:=[]byte{4,4,4,12};objects:=map[string]string{};rows:=[]Row{}
         for i,raw:=range [][]byte{sum,b}{var z bytes.Buffer;w:=zlib.NewWriter(&z);w.Write(raw);w.Close();key:=string(rune('a'+i));objects[key]=base64.StdEncoding.EncodeToString(append([]byte("pad"),z.Bytes()...));c:=[]byte{1,1};if i==1{c=[]byte{0,1}};rows=append(rows,Row{Object:key,Offset:3,Length:z.Len(),Codec:"zlib",Coefficients:c,SHA256:digest(raw)})}
         m:=Manifest{Stripes:[]Stripe{{ID:"s",Width:4,DataShards:2,Rows:rows,ChunkSHA256:[]string{digest(a),digest(b)}}},Files:[]File{{Name:"f",Chunks:[]Chunk{{Stripe:"s",Index:0},{Stripe:"s",Index:1}},Bytes:8,SHA256:digest(append(a,b...))}}}
         got,e:=Recover(m,objects);if e!=nil||!bytes.Equal(got["f"],append(a,b...)){t.Fatalf("decoding failed: %v",e)}
         delete(objects,"b");got,e=Recover(m,objects);if e==nil||len(got)!=0{t.Fatal("accepted insufficient equations")}
        }
