      api.py: |
        import base64,hashlib,json,sys
        r=json.loads(sys.argv[1]);data=json.load(open('objects.json'));key=r['key'];replicas=data.get(key,[])
        if r['op']=='locate':print(json.dumps([dict(replica=v['replica'],bytes=len(base64.b64decode(v['body'])),etag=hashlib.sha256(base64.b64decode(v['body'])).hexdigest()) for v in replicas]))
        else:
         v=next((v for v in replicas if v['replica']==r['replica']),None)
         if v is None:print(json.dumps({'error':'not found'}))
         elif type(r['offset']) is not int or type(r['limit']) is not int or r['offset']<0 or not 1<=r['limit']<=128:print(json.dumps({'error':'invalid range'}))
         else:
          body=base64.b64decode(v['body']);end=min(len(body),r['offset']+r['limit']);print(json.dumps(dict(body=base64.b64encode(body[r['offset']:end]).decode(),next_offset=end if end<len(body) else None)))
