    kind: "service"
    temp_workspace: true
    files:
      AGENTS.yml: |
        version: 1
        environment:
          sample: |
            def sample(transactions, fragment_size=23):
                "sample(transactions, fragment_size=23) -> dict: Run the installed V1 writer; return base64 slot0 and acknowledged key/value strings. Each transaction has changes and optional commit=True; put changes take op=\"put\", key(uint32), value(uint64 decimal string), delete takes op=\"delete\", key. Only the final transaction may be uncommitted. Fragment size is 1..256."
                return json.decode(privileged.shell("python3","-B","encoder.py",json.encode({"transactions":transactions,"fragment_size":fragment_size}), timeout=15).output())
      encoder.py: |
        import base64,json,struct,sys

        def crc32c(data):
            h=0xffffffff
            for b in data:
                h^=b
                for _ in range(8):h=(h>>1)^(0x82f63b78 if h&1 else 0)
            return h^0xffffffff

        def varint(x):
            out=bytearray()
            while x>=128:out.append((x&127)|128);x>>=7
            out.append(x);return bytes(out)

        def encode(transactions,fragment_size=23):
            if type(fragment_size) is not int or not 1<=fragment_size<=256:raise ValueError('fragment_size must be 1..256')
            image=bytearray(b'SAJ1'+struct.pack('<I',1));state={}
            for sequence,tx in enumerate(transactions,1):
                changes=tx['changes'];payload=bytearray(varint(len(changes)));pending=state.copy()
                for change in changes:
                    key=int(change['key'])
                    if not 0<=key<=0xffffffff:raise ValueError('key outside uint32')
                    if change['op']=='put':
                        value=int(change['value'])
                        if not 0<=value<=0xffffffffffffffff:raise ValueError('value outside uint64')
                        payload+=bytes([1])+varint(key)+varint(value);pending[key]=value
                    elif change['op']=='delete':payload+=bytes([2])+varint(key);pending.pop(key,None)
                    else:raise ValueError('unknown operation')
                committed=tx.get('commit',True);payload.append(0xa5 if committed else 0)
                parts=[payload[i:i+fragment_size] for i in range(0,len(payload),fragment_size)]
                for i,part in enumerate(parts):
                    kind=1 if len(parts)==1 else 2 if i==0 else 4 if i==len(parts)-1 else 3
                    header=struct.pack('<IHBx',sequence,len(part),kind)
                    image+=header+struct.pack('<I',crc32c(header+part))+part
                if committed:state=pending
                elif sequence!=len(transactions):raise ValueError('uncommitted transaction must be last')
            if len(image)>65536:raise ValueError('image exceeds slot capacity')
            return dict(slot0=base64.b64encode(image).decode(),acknowledged={str(k):str(v) for k,v in sorted(state.items())})

        if __name__=='__main__':
            try:print(json.dumps(encode(**json.loads(sys.argv[1]))))
            except (ValueError,KeyError,TypeError) as e:print(json.dumps({'error':str(e)}))
