# Evaluation focus: Swift string indexing and extended grapheme clusters
# Run only after review; live recordings are retained in tests/sessions.
version: 1
provider:
  name: "openai"
  model: "gpt-6.1-sol"
  reasoning: "high"
developer: "Keep changes small and preserve public APIs unless the task asks for a change. Use the available checks and report their results. If a required toolchain is missing, report that rather than installing it."
services:
  main:
    kind: "service"
    temp_workspace: true
    files:
      AGENTS.yml: |
        version: 1
        workspace:
          read: true
          write: true
          denied_files: ["AGENTS.yml", "main.swift"]
        environment:
          check: |
            def check():
                """check() -> result: Compile with Xcode's Swift compiler and run Unicode checks."""
                compiled = privileged.shell("swiftc", "Preview.swift", "main.swift", "-o", ".preview-check", timeout=60).run()
                if not compiled.ok:
                    return compiled
                return privileged.shell("./.preview-check", timeout=10).run()
      README.md: |
        # Unicode preview
        Uses the Swift compiler installed with Xcode; no package manager is required.
        check() compiles Preview.swift with main.swift and runs the checks.
        The public API is preview(_ text: String, maxCharacters: Int) -> String.
        A Character includes its combining marks and complete joined emoji sequence.
      Preview.swift: |
        func preview(_ text: String, maxCharacters: Int) -> String {
            if text.utf16.count <= maxCharacters {
                return text
            }
            return String(decoding: text.utf16.prefix(maxCharacters), as: UTF16.self) + "…"
        }
      main.swift: |
        import Foundation

        let cases: [(String, Int, String)] = [
            ("hello", 3, "hel…"),
            ("hello", 5, "hello"),
            ("café", 4, "café"),
            ("e\u{301}x", 1, "e\u{301}…"),
            ("🙂🙂!", 1, "🙂…"),
            ("👩‍👩‍👧‍👦!", 1, "👩‍👩‍👧‍👦…"),
            ("🇦🇺!", 1, "🇦🇺…"),
            ("x", 0, "…"),
            ("", 0, ""),
            ("small", Int.max, "small"),
        ]
        for (text, limit, expected) in cases {
            let actual = preview(text, maxCharacters: limit)
            if actual != expected {
                let message = "preview(\(text.debugDescription), \(limit)): expected \(expected.debugDescription), got \(actual.debugDescription)\n"
                FileHandle.standardError.write(Data(message.utf8))
                exit(1)
            }
        }
        print("Swift Unicode checks passed")
prompt: |
  The preview helper splits emoji and combining characters. Fix preview so maxCharacters
  counts Swift Characters (extended grapheme clusters), not UTF-16 code units or bytes.
  If the input fits, return it unchanged. Otherwise return the first maxCharacters
  Characters followed by one ellipsis (…). The ellipsis does not count toward the limit.
  A zero limit returns an ellipsis for nonempty input and an empty string for empty input.
  Callers supply nonnegative limits. Preserve the function signature and use no packages.
